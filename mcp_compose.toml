[composer]
name = "uny-mcp"
conflict_resolution = "prefix"
# Fixed port: committed client configs depend on this.
# If the port is in use, change here and in .mcp.json, .codex/config.toml, opencode.json.
port = 19100

[transport]
stdio_enabled = false
streamable_http_enabled = true
streamable_http_path = "/mcp"
streamable_http_cors_enabled = false

[[servers.proxied.stdio]]
name = "serena"
command = [
  "${HOME}/.local/bin/uvx",
  "-p", "3.13",
  "--from", "git+https://github.com/oraios/serena@ede329aaf0c824bea75455a2926f01420d7aa620",
  "serena", "start-mcp-server",
  "--project", "${MCP_COMPOSE_CONFIG_DIR}",
  "--context", "ide",
  "--agent-interface", "tools",
  "--open-web-dashboard", "false"
]
restart_policy = "never"
max_restarts = 0

# JetBrains tools are available when the IDE serves this endpoint at startup.
[[servers.proxied.sse]]
name = "jetbrains"
url = "http://127.0.0.1:64342/sse"
reconnect_on_failure = true
max_reconnect_attempts = 3
