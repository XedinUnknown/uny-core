services:
  dev:
    build:
      context: .
      target: dev
    image: ${DEV_IMAGE}
    working_dir: ${WORKDIR}
    volumes:
      - .:${WORKDIR}
      - ${HOST_PNPM_STORE}:${PNPM_STORE}
    environment:
      PNPM_HOME: ${PNPM_HOME}
      npm_config_store_dir: ${PNPM_STORE}
      XDG_CONFIG_HOME: ${XDG_CONFIG_HOME}
    command: ["sleep", "infinity"]

  uny:
    build: { context: ., target: runtime }
    image: ghcr.io/xedinunknown/uny-core:latest
    volumes:
      - .:/project
    environment:
      UNY_PROJECT_DIR: /project
