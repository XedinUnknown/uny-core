schema: spec-driven

context: |
  This root OpenSpec directory exists solely to provide the tool-skill generation target
  that populates .agents/skills/openspec-*/. It contains no specs. All capability specs
  live in their respective package openspec directories:

    packages/di/openspec/     — @uny/di composition and container specs
    packages/core/openspec/   — @uny/core configuration specs
    packages/cli/openspec/    — @uny/cli command-line interface specs

  Do not add specs here. Use `openspec validate --all` from a package directory to validate
  its specs, or run `make validate-specs` from the repository root.
