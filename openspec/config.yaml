schema: spec-driven

context: |
  The initial specs are a descriptive baseline of committed implementation,
  not an import of planned requirements. Preserve that distinction: plans,
  package design documents, and memories do not establish implemented behavior.
  Propose future behavior explicitly as changes rather than silently expanding
  the baseline. See openspec/README.md for baseline scope and provenance.

design:
  architecture: openspec/design/architecture.md
  implementation-plan: openspec/design/implementation-plan.md
